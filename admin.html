<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AkashRuru Admin</title><link rel="stylesheet" href="style.css"></head><body><main class="adminpage"><div id="login" class="panel"><h1>AkashRuru Admin</h1><p>Enter your admin password.</p><input id="pass" type="password" placeholder="Password"><button class="btn" onclick="login()">Login</button><p id="err"></p></div><div id="dash" class="panel hidden"><div class="top"><h1>Story Manager</h1><button onclick="logout()">Logout</button></div><form id="form"><input id="title" required placeholder="Story title"><select id="cat"><option>Romantic</option><option>Sad</option><option>Horror</option><option>Friendship</option><option>Other</option></select><textarea id="body" required placeholder="Write your story..."></textarea><button class="btn">Publish Story</button></form><h2>Your Stories</h2><div id="list"></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin.js"></script></body></html>
